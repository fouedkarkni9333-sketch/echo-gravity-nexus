<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Echo Gravity Nexus</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0b0f19;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #00ffff;
            background: rgba(11, 15, 25, 0.85);
            padding: 12px 18px;
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            pointer-events: none;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.15);
        }
        #ui h1 {
            margin: 0 0 5px 0;
            font-size: 18px;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.5);
        }
        #ui p {
            margin: 0;
            font-size: 12px;
            color: #a0aec0;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.8);
        }
        #hotbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: rgba(11, 15, 25, 0.85);
            padding: 10px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
        }
        .slot {
            width: 45px;
            height: 45px;
            border: 2px solid #2d3748;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }
        .slot.active {
            border-color: #00ffff;
            transform: scale(1.08);
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.4);
        }
        .slot-color {
            width: 26px;
            height: 26px;
            border-radius: 6px;
        }
        #mobile-controls {
            position: absolute;
            bottom: 90px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
            pointer-events: none;
        }
        .control-group {
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-gap: 6px;
            pointer-events: auto;
        }
        .btn {
            width: 50px;
            height: 50px;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 255, 0.3);
            color: #00ffff;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .btn:active {
            background: rgba(0, 255, 255, 0.3);
        }
        #jump-btn {
            pointer-events: auto;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(0, 255, 255, 0.15);
            border: 1px solid rgba(0, 255, 255, 0.4);
            color: #00ffff;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            align-self: flex-end;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui">
        <h1>Echo Gravity Nexus</h1>
        <p>التحكم: W, A, S, D للحركة | الماوس للنظر | انقر للبناء أو الحذف</p>
    </div>
    <div id="crosshair"></div>
    
    <div id="hotbar">
        <div class="slot active" onclick="selectBlock(0)"><div class="slot-color" style="background:#2e7d32"></div></div>
        <div class="slot" onclick="selectBlock(1)"><div class="slot-color" style="background:#795548"></div></div>
        <div class="slot" onclick="selectBlock(2)"><div class="slot-color" style="background:#616161"></div></div>
        <div class="slot" onclick="selectBlock(3)"><div class="slot-color" style="background:#3e2723"></div></div>
        <div class="slot" onclick="selectBlock(4)"><div class="slot-color" style="background:#81c784"></div></div>
        <div class="slot" onclick="selectBlock(5)"><div class="slot-color" style="background:#e0e0e0"></div></div>
        <div class="slot" onclick="selectBlock(6)"><div class="slot-color" style="background:#00bcd4"></div></div>
        <div class="slot" onclick="selectBlock(7)"><div class="slot-color" style="background:#ffb300"></div></div>
    </div>

    <div id="mobile-controls">
        <div class="control-group">
            <div></div>
            <div class="btn" ontouchstart="moveState.forward=true" ontouchend="moveState.forward=false">⬆️</div>
            <div></div>
            <div class="btn" ontouchstart="moveState.left=true" ontouchend="moveState.left=false">⬅️</div>
            <div class="btn" ontouchstart="moveState.backward=true" ontouchend="moveState.backward=false">⬇️</div>
            <div class="btn" ontouchstart="moveState.right=true" ontouchend="moveState.right=false">➡️</div>
        </div>
        <div id="jump-btn" ontouchstart="triggerJump()">قفز</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer;
        let blocks = [];
        let raycaster, mouse;
        let selectedMaterialIndex = 0;
        
        const blockColors = [0x2e7d32, 0x795548, 0x616161, 0x3e2723, 0x81c784, 0xe0e0e0, 0x00bcd4, 0xffb300];
        
        const moveState = { forward: false, backward: false, left: false, right: false };
        let velocity = new THREE.Vector3();
        let position = new THREE.Vector3(0, 12, 10);
        let pitch = 0, yaw = 0;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b0f19);
            scene.fog = new THREE.FogExp2(0x0b0f19, 0.035);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0x00ffff, 0.8);
            dirLight.position.set(20, 40, 20);
            scene.add(dirLight);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // توليد عالم افتراضي أولي
            for (let x = -6; x <= 6; x++) {
                for (let z = -6; z <= 6; z++) {
                    let h = Math.floor(Math.sin(x * 0.5) * Math.cos(z * 0.5) * 2) + 2;
                    for (let y = 0; y <= h; y++) {
                        let matIdx = (y === h) ? 0 : (y > 1 ? 1 : 2);
                        createBlock(x, y, z, blockColors[matIdx]);
                    }
                }
            }

            window.addEventListener('resize', onWindowResize);
            document.addEventListener('mousedown', onMouseDown);
            
            // تحكم الماوس للكمبيوتر
            let isMouseDown = false;
            let prevMouseX = 0, prevMouseY = 0;
            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === document.body || e.buttons === 2) {
                    yaw -= e.movementX * 0.003;
                    pitch -= e.movementY * 0.003;
                    pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
                }
            });
            document.body.addEventListener('click', () => {
                document.body.requestPointerLock();
            });

            // لوحة المفاتيح
            document.addEventListener('keydown', (e) => {
                if (e.key === 'w' || e.key === 'W') moveState.forward = true;
                if (e.key === 's' || e.key === 'S') moveState.backward = true;
                if (e.key === 'a' || e.key === 'A') moveState.left = true;
                if (e.key === 'd' || e.key === 'D') moveState.right = true;
                if (e.key === ' ') triggerJump();
                if (e.key >= '1' && e.key <= '8') selectBlock(parseInt(e.key) - 1);
            });
            document.addEventListener('keyup', (e) => {
                if (e.key === 'w' || e.key === 'W') moveState.forward = false;
                if (e.key === 's' || e.key === 'S') moveState.backward = false;
                if (e.key === 'a' || e.key === 'A') moveState.left = false;
                if (e.key === 'd' || e.key === 'D') moveState.right = false;
            });
        }

        function createBlock(x, y, z, colorHex) {
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshLambertMaterial({ color: colorHex });
            const cube = new THREE.Mesh(geometry, material);
            cube.position.set(x, y, z);
            scene.add(cube);
            blocks.push(cube);
        }

        function selectBlock(index) {
            selectedMaterialIndex = index;
            const slots = document.querySelectorAll('.slot');
            slots.forEach((s, i) => {
                if (i === index) s.classList.add('active');
                else s.classList.remove('active');
            });
        }

        function triggerJump() {
            if (position.y <= 2.1) {
                velocity.y = 0.12;
            }
        }

        function onMouseDown(e) {
            if (document.pointerLockElement !== document.body) return;
            
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(blocks);

            if (intersects.length > 0) {
                const intersect = intersects[0];
                if (e.button === 0) {
                    // حذف الكتل
                    scene.remove(intersect.object);
                    blocks = blocks.filter(b => b !== intersect.object);
                } else if (e.button === 2) {
                    // بناء كتلة جديدة
                    const pos = intersect.object.position.clone().add(intersect.face.normal);
                    createBlock(pos.x, pos.y, pos.z, blockColors[selectedMaterialIndex]);
                }
            }
        }

        // إلغاء القائمة المنسدلة للزر الأيمن
        document.addEventListener('contextmenu', e => e.preventDefault());

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // حساب الحركة
            let speed = 0.08;
            let dir = new THREE.Vector3();
            if (moveState.forward) dir.z -= 1;
            if (moveState.backward) dir.z += 1;
            if (moveState.left) dir.x -= 1;
            if (moveState.right) dir.x += 1;
            dir.normalize();
            dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
            
            position.x += dir.x * speed;
            position.z += dir.z * speed;

            // الجاذبية والقفز
            velocity.y -= 0.006;
            position.y += velocity.y;
            if (position.y < 2) {
                position.y = 2;
                velocity.y = 0;
            }

            camera.position.copy(position);
            
            // تحديث زاوية الكاميرا
            let euler = new THREE.Euler(pitch, yaw, 0, 'YXZ');
            camera.quaternion.setFromEuler(euler);

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
