<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Reaction Engine - التجربة الأولى</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      position: relative;
      width: 480px;
      height: 360px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 3px solid #38bdf8;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* المرآة */
    }
    .status-box {
      margin-top: 20px;
      font-size: 1.4rem;
      font-weight: bold;
      background: #1e293b;
      padding: 15px 30px;
      border-radius: 8px;
      border: 1px solid #475569;
    }
  </style>
</head>
<body>

  <h1>اختبار كاشف حركات الوجه 🎯</h1>
  
  <div class="container">
    <video id="webcam" autoplay playsinline></video>
  </div>

  <div class="status-box" id="status">جاري تحميل المحرك والتعرف على الكاميرا...</div>

  <!-- MediaPipe Vision Tasks -->
  <script type="module">
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

    const video = document.getElementById("webcam");
    const statusText = document.getElementById("status");
    let faceLandmarker;
    let lastVideoTime = -1;

    async function initFaceTracker() {
      const filesetResolver = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
      );
      
      faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
        baseOptions: {
          modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`,
          delegate: "GPU"
        },
        outputFaceBlendshapes: true,
        runningMode: "VIDEO",
        numFaces: 1
      });

      startCamera();
    }

    async function startCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      video.srcObject = stream;
      video.addEventListener("loadeddata", predictWebcam);
      statusText.innerText = "وجّه وجهك نحو الكاميرا وقم بالحركات!";
    }

    async function predictWebcam() {
      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const results = faceLandmarker.detectForVideo(video, performance.now());

        if (results.faceBlendshapes && results.faceBlendshapes.length > 0) {
          const shapes = results.faceBlendshapes[0].categories;
          
          // استخراج نسب الحركات
          const jawOpen = shapes.find(s => s.categoryName === "jawOpen")?.score || 0;
          const eyeBlinkLeft = shapes.find(s => s.categoryName === "eyeBlinkLeft")?.score || 0;
          const eyeBlinkRight = shapes.find(s => s.categoryName === "eyeBlinkRight")?.score || 0;

          // تحليل الحركة وتحديث الواجهة
          if (jawOpen > 0.45) {
            statusText.innerText = "😮 الفم مفتوح (هجوم / قفز)!";
            statusText.style.color = "#4ade80";
          } else if (eyeBlinkLeft > 0.5 && eyeBlinkRight > 0.5) {
            statusText.innerText = "😑 إغلاق العينين (دفاع)!";
            statusText.style.color = "#facc15";
          } else if (eyeBlinkLeft > 0.5) {
            statusText.innerText = "😉 غمزة بالعين اليسرى!";
            statusText.style.color = "#38bdf8";
          } else {
            statusText.innerText = "🙂 وضع الاستعداد...";
            statusText.style.color = "#ffffff";
          }
        }
      }
      requestAnimationFrame(predictWebcam);
    }

    initFaceTracker();
  </script>
</body>
</html>
