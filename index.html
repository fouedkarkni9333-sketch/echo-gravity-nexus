<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo-Gravity: Nexus | النموذج الأولي</title>
    <style>
        body {
            margin: 0;
            background: #0b0f19;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        canvas {
            background: #111827;
            border: 2px solid #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            border-radius: 8px;
            max-width: 95vw;
            max-height: 70vh;
        }
        .ui {
            margin-bottom: 10px;
            text-align: center;
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 20px;
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }
        p {
            margin: 0;
            font-size: 13px;
            color: #9ca3af;
        }
    </style>
</head>
<body>

    <div class="ui">
        <h1>Echo-Gravity: Nexus</h1>
        <p>المس الشاشة لقلب الجاذبية وإطلاق النسخة الطيفية (Echo)!</p>
    </div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let player = {
            x: 100,
            y: 330,
            width: 30,
            height: 30,
            color: "#00ffff",
            vy: 0,
            gravity: 0.6,
            isFlipped: false
        };

        let echoes = [];
        let obstacles = [
            { x: 500, y: 0, width: 40, height: 150 },
            { x: 700, y: 250, width: 40, height: 150 }
        ];

        let score = 0;

        function toggleGravity() {
            player.isFlipped = !player.isFlipped;
            player.gravity = -player.gravity;
            
            echoes.push({
                x: player.x,
                y: player.y,
                color: "#ff007f",
                opacity: 0.9
            });
            
            if (echoes.length > 5) echoes.shift();
        }

        window.addEventListener("keydown", (e) => {
            if (e.code === "Space") toggleGravity();
        });

        canvas.addEventListener("touchstart", (e) => {
            e.preventDefault();
            toggleGravity();
        });

        canvas.addEventListener("click", () => toggleGravity());

        function update() {
            player.y += player.vy;
            player.vy += player.gravity;

            if (!player.isFlipped && player.y > 330) {
                player.y = 330;
                player.vy = 0;
            } else if (player.isFlipped && player.y < 40) {
                player.y = 40;
                player.vy = 0;
            }

            obstacles.forEach(obs => {
                obs.x -= 4;
                if (obs.x + obs.width < 0) {
                    obs.x = canvas.width + Math.random() * 200;
                    score += 10;
                }
            });

            echoes.forEach(echo => {
                echo.x -= 4;
                echo.opacity -= 0.005;
            });
        }

        function draw() {
            ctx.fillStyle = "#111827";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = "#1f2937";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, 40); ctx.lineTo(canvas.width, 40);
            ctx.moveTo(0, 360); ctx.lineTo(canvas.width, 360);
            ctx.stroke();

            ctx.fillStyle = "#374151";
            obstacles.forEach(obs => {
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                ctx.strokeStyle = "#00ffff";
                ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
            });

            echoes.forEach(echo => {
                ctx.save();
                ctx.globalAlpha = Math.max(echo.opacity, 0);
                ctx.fillStyle = echo.color;
                ctx.fillRect(echo.x, echo.y, player.width, player.height);
                ctx.shadowColor = "#ff007f";
                ctx.shadowBlur = 15;
                ctx.restore();
            });

            ctx.save();
            ctx.fillStyle = player.color;
            ctx.shadowColor = "#00ffff";
            ctx.shadowBlur = 20;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.restore();

            ctx.fillStyle = "#fff";
            ctx.font = "16px Arial";
            ctx.fillText("النقاط: " + score, 20, 30);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
