<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo-Gravity: Nexus | شخصيات حية</title>
    <style>
        body {
            margin: 0;
            background: #070913;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        canvas {
            background: #101728;
            border: 2px solid #00f0ff;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
            border-radius: 12px;
            max-width: 95vw;
            max-height: 58vh;
        }
        .ui {
            margin-bottom: 5px;
            text-align: center;
        }
        h1 {
            margin: 0 0 2px 0;
            font-size: 16px;
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
        }
        p {
            margin: 0;
            font-size: 11px;
            color: #9ca3af;
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-top: 12px;
        }
        .btn-game {
            background: linear-gradient(135deg, #ff0055, #ff5500);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 40px;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
            cursor: pointer;
            outline: none;
        }
        .btn-shoot {
            background: linear-gradient(135deg, #00f0ff, #0077ff);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
            color: #070913;
        }
        .btn-game:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="ui">
        <h1>Echo-Gravity: Nexus (Hero Edition)</h1>
        <p>تحكم بالشخصية الحية واقضِ على الأعداء!</p>
    </div>

    <canvas id="gameCanvas" width="800" height="360"></canvas>

    <div class="controls">
        <button class="btn-game" onclick="toggleGravity()">🔄 قلب الجاذبية</button>
        <button class="btn-game btn-shoot" onclick="shootBullet()">🔥 إطلاق نار</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // البطل الحقيقي (بمواصفات شخصية مرسومة)
        let player = {
            x: 80,
            y: 280,
            width: 32,
            height: 50,
            vy: 0,
            gravity: 0.5,
            isFlipped: false,
            hp: 100,
            name: "بطل النيون"
        };

        let bullets = [];
        let enemies = [
            { x: 600, y: 280, width: 32, height: 50, hp: 40, speed: 2, type: "enemy" }
        ];

        let score = 0;

        function toggleGravity() {
            player.isFlipped = !player.isFlipped;
            player.gravity = -player.gravity;
        }

        function shootBullet() {
            bullets.push({
                x: player.x + player.width,
                y: player.y + 20,
                width: 16,
                height: 5,
                speed: 8
            });
        }

        function update() {
            player.y += player.vy;
            player.vy += player.gravity;

            if (!player.isFlipped && player.y > 280) {
                player.y = 280;
                player.vy = 0;
            } else if (player.isFlipped && player.y < 40) {
                player.y = 40;
                player.vy = 0;
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].x += bullets[i].speed;
                if (bullets[i].x > canvas.width) {
                    bullets.splice(i, 1);
                }
            }

            enemies.forEach((enemy) => {
                enemy.x -= enemy.speed;
                if (enemy.x < -50) {
                    enemy.x = canvas.width + Math.random() * 200;
                    enemy.y = Math.random() > 0.5 ? 280 : 40;
                    enemy.hp = 40;
                }

                bullets.forEach((bullet, bIndex) => {
                    if (
                        bullet.x < enemy.x + enemy.width &&
                        bullet.x + bullet.width > enemy.x &&
                        bullet.y < enemy.y + enemy.height &&
                        bullet.y + bullet.height > enemy.y
                    ) {
                        enemy.hp -= 20;
                        bullets.splice(bIndex, 1);
                        if (enemy.hp <= 0) {
                            score += 100;
                            enemy.x = canvas.width + 250;
                            enemy.hp = 40;
                        }
                    }
                });
            });
        }

        // دالة لرسم شخصية حية (تحتوي على رأس، شعر، جسم، ولباس تفصيلي)
        function drawCharacter(x, y, isEnemy, isFlipped) {
            ctx.save();
            
            // تحديد الألوان (البطل أزرق نيون، العدو أحمر قرمزي)
            let primaryColor = isEnemy ? "#ff0055" : "#00f0ff";
            let secondaryColor = isEnemy ? "#550022" : "#005577";
            
            if (isFlipped) {
                // إذا كانت مقلوبة في السقف
                ctx.translate(x + 16, y + 25);
                ctx.scale(1, -1);
                ctx.translate(-(x + 16), -(y + 25));
            }

            // 1. الرأس والوجه
            ctx.fillStyle = "#ffccaa"; // لون البشرة
            ctx.fillRect(x + 8, y + 2, 16, 14);
            
            // الشعر أو الخوذة
            ctx.fillStyle = primaryColor;
            ctx.fillRect(x + 6, y, 20, 6);

            // 2. الجسم والسترة (اللباس القتالي)
            ctx.fillStyle = secondaryColor;
            ctx.fillRect(x + 4, y + 16, 24, 20);
            
            // شعار أو خط روشن في السترة
            ctx.fillStyle = primaryColor;
            ctx.fillRect(x + 12, y + 18, 8, 14);

            // 3. الأرجل
            ctx.fillStyle = "#222233";
            ctx.fillRect(x + 6, y + 36, 8, 12);
            ctx.fillRect(x + 18, y + 36, 8, 12);

            // إضاءة النيون المحيطة بالشخصية
            ctx.shadowColor = primaryColor;
            ctx.shadowBlur = 10;
            ctx.strokeStyle = primaryColor;
            ctx.lineWidth = 1.5;
            ctx.strokeRect(x + 4, y + 16, 24, 20);

            ctx.restore();
        }

        function draw() {
            ctx.fillStyle = "#101728";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // مسار الأرضية والسقف
            ctx.strokeStyle = "#ff0055";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, 40); ctx.lineTo(canvas.width, 40);
            ctx.moveTo(0, 330); ctx.lineTo(canvas.width, 330);
            ctx.stroke();

            // رسم البطل الحقيقي
            drawCharacter(player.x, player.y, false, player.isFlipped);

            // رسم العدو الحي
            enemies.forEach(enemy => {
                drawCharacter(enemy.x, enemy.y, true, false);
                
                // شريط الصحة للعدو
                ctx.fillStyle = "#ff0000";
                ctx.fillRect(enemy.x, enemy.y - 10, enemy.width, 4);
                ctx.fillStyle = "#00ff00";
                ctx.fillRect(enemy.x, enemy.y - 10, (enemy.width * (enemy.hp / 40)), 4);
            });

            // رسم الطلقات النارية
            bullets.forEach(bullet => {
                ctx.fillStyle = "#ffff00";
                ctx.shadowColor = "#ffaa00";
                ctx.shadowBlur = 8;
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
            });

            // النقاط والصحة
            ctx.fillStyle = "#fff";
            ctx.font = "bold 14px Arial";
            ctx.fillText("النقاط: " + score, 20, 28);
            ctx.fillText("صحة البطل: " + player.hp + "%", canvas.width - 140, 28);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
