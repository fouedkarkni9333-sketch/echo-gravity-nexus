<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Echo Gravity Nexus</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #05070d;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #00ffff;
            background: rgba(5, 7, 13, 0.85);
            padding: 12px 18px;
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.4);
            pointer-events: none;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            z-index: 10;
        }
        #ui h1 {
            margin: 0 0 3px 0;
            font-size: 16px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.7);
        }
        #ui p {
            margin: 0;
            font-size: 11px;
            color: #a0aec0;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            border: 2px solid rgba(0, 255, 255, 0.9);
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.8);
            z-index: 5;
        }
        #hotbar {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: rgba(5, 7, 13, 0.9);
            padding: 10px;
            border-radius: 14px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            z-index: 10;
            max-width: 95vw;
            overflow-x: auto;
        }
        .slot {
            width: 42px;
            height: 42px;
            border: 2px solid #1a202c;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        .slot.active {
            border-color: #00ffff;
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.6);
        }
        .slot-color {
            width: 24px;
            height: 24px;
            border-radius: 6px;
        }
        #joystick-zone {
            position: absolute;
            bottom: 90px;
            left: 20px;
            width: 120px;
            height: 120px;
            background: rgba(0, 255, 255, 0.05);
            border: 2px dashed rgba(0, 255, 255, 0.25);
            border-radius: 50%;
            z-index: 10;
            touch-action: none;
        }
        #joystick-knob {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: rgba(0, 255, 255, 0.35);
            border: 1px solid rgba(0, 255, 255, 0.7);
            border-radius: 50%;
            pointer-events: none;
            transition: transform 0.05s linear;
        }
        .action-btns {
            position: absolute;
            bottom: 90px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }
        .action-btn {
            width: 60px;
            height: 60px;
            background: rgba(0, 255, 255, 0.15);
            border: 1px solid rgba(0, 255, 255, 0.4);
            color: #00ffff;
            font-size: 14px;
            font-weight: bold;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.25);
        }
        .action-btn:active {
            background: rgba(0, 255, 255, 0.4);
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui">
        <h1>Echo Gravity Nexus</h1>
        <p>عالم الكتل الفضائي | اسحب الشاشة للتجول والبناء</p>
    </div>
    <div id="crosshair"></div>
    
    <!-- قائمة المواد والكتل الفضائية المضيئة -->
    <div id="hotbar">
        <div class="slot active" onclick="selectBlock(0)"><div class="slot-color" style="background:#00ffcc"></div></div>
        <div class="slot" onclick="selectBlock(1)"><div class="slot-color" style="background:#4b0082"></div></div>
        <div class="slot" onclick="selectBlock(2)"><div class="slot-color" style="background:#374151"></div></div>
        <div class="slot" onclick="selectBlock(3)"><div class="slot-color" style="background:#8b4513"></div></div>
        <div class="slot" onclick="selectBlock(4)"><div class="slot-color" style="background:#00ff00"></div></div>
        <div class="slot" onclick="selectBlock(5)"><div class="slot-color" style="background:#e0f2fe"></div></div>
        <div class="slot" onclick="selectBlock(6)"><div class="slot-color" style="background:#ff007f"></div></div>
        <div class="slot" onclick="selectBlock(7)"><div class="slot-color" style="background:#fbbf24"></div></div>
    </div>

    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>
    <div class="action-btns">
        <div class="action-btn" id="jump-btn">قفز</div>
        <div class="action-btn" id="build-btn" style="background: rgba(251,191,36,0.2); border-color: rgba(251,191,36,0.5); color: #fbbf24;">بناء</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer;
        let blocks = [];
        let raycaster;
        let selectedMaterialIndex = 0;
        
        // ألوان الكتل ذات الطابع الفضائي والمستقبلي المضيء
        const blockColors = [0x00ffcc, 0x4b0082, 0x374151, 0x8b4513, 0x00ff00, 0xe0f2fe, 0xff007f, 0xfbbf24];
        
        let moveVector = new THREE.Vector2(0, 0);
        let velocity = new THREE.Vector3();
        let position = new THREE.Vector3(0, 15, 12);
        let pitch = 0, yaw = 0;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x05070d);
            scene.fog = new THREE.FogExp2(0x05070d, 0.025);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // إضاءة محيطية وفضائية ساحرة
            const ambientLight = new THREE.AmbientLight(0x88ccff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0x00ffff, 1.0);
            dirLight.position.set(30, 60, 30);
            scene.add(dirLight);

            // إضافة نجوم متلألئة في السماء الخلفية
            createCosmicStars();

            raycaster = new THREE.Raycaster();

            // توليد عالم وتضاريس متسعة وأكثر دقة (عالم فضائي مدمج)
            for (let x = -12; x <= 12; x++) {
                for (let z = -12; z <= 12; z++) {
                    let h = Math.floor(Math.sin(x * 0.3) * Math.cos(z * 0.3) * 3) + 3;
                    for (let y = 0; y <= h; y++) {
                        let matIdx = (y === h) ? 0 : (y > 2 ? 1 : 2);
                        if (Math.random() < 0.05 && y === h) matIdx = 6; // بلورات نيون متفرقة
                        createBlock(x, y, z, blockColors[matIdx]);
                    }
                }
            }

            window.addEventListener('resize', onWindowResize);
            setupTouchAndMouseControls();
        }

        function createCosmicStars() {
            const starsGeometry = new THREE.BufferGeometry();
            const starsCount = 600;
            const starPositions = new Float32Array(starsCount * 3);

            for(let i = 0; i < starsCount * 3; i += 3) {
                starPositions[i] = (Math.random() - 0.5) * 400;
                starPositions[i+1] = Math.random() * 200 + 20;
                starPositions[i+2] = (Math.random() - 0.5) * 400;
            }

            starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
            const starsMaterial = new THREE.PointsMaterial({color: 0xffffff, size: 1.2, transparent: true, opacity: 0.8});
            const starField = new THREE.Points(starsGeometry, starsMaterial);
            scene.add(starField);
        }

        function createBlock(x, y, z, colorHex) {
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            // استخدام مواد مضيئة وتفاعلية مع الإضاءة
            const material = new THREE.MeshStandardMaterial({ 
                color: colorHex,
                roughness: 0.3,
                metalness: 0.2
            });
            const cube = new THREE.Mesh(geometry, material);
            cube.position.set(x, y, z);
            scene.add(cube);
            blocks.push(cube);
        }

        function selectBlock(index) {
            selectedMaterialIndex = index;
            const slots = document.querySelectorAll('.slot');
            slots.forEach((s, i) => {
                if (i === index) s.classList.add('active');
                else s.classList.remove('active');
            });
        }

        function setupTouchAndMouseControls() {
            const zone = document.getElementById('joystick-zone');
            const knob = document.getElementById('joystick-knob');
            let joystickTouchId = null;
            let zoneRect = zone.getBoundingClientRect();

            zone.addEventListener('touchstart', (e) => {
                if (joystickTouchId === null) {
                    const touch = e.changedTouches[0];
                    joystickTouchId = touch.identifier;
                    updateJoystick(touch);
                }
            });

            zone.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.identifier === joystickTouchId) {
                        updateJoystick(touch);
                    }
                }
            });

            function endJoystick(e) {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === joystickTouchId) {
                        joystickTouchId = null;
                        moveVector.set(0, 0);
                        knob.style.transform = `translate(0px, 0px)`;
                    }
                }
            }
            zone.addEventListener('touchend', endJoystick);
            zone.addEventListener('touchcancel', endJoystick);

            function updateJoystick(touch) {
                zoneRect = zone.getBoundingClientRect();
                let centerX = zoneRect.left + zoneRect.width / 2;
                let centerY = zoneRect.top + zoneRect.height / 2;
                let dx = touch.clientX - centerX;
                let dy = touch.clientY - centerY;
                let dist = Math.sqrt(dx * dx + dy * dy);
                let maxDist = 45;

                if (dist > maxDist) {
                    dx = (dx / dist) * maxDist;
                    dy = (dy / dist) * maxDist;
                }

                knob.style.transform = `translate(${dx}px, ${dy}px)`;
                moveVector.set(dx / maxDist, dy / maxDist);
            }

            let isDragging = false;
            let prevX = 0, prevY = 0;

            window.addEventListener('touchstart', (e) => {
                if (e.target.closest('#joystick-zone') || e.target.closest('#hotbar') || e.target.closest('.action-btns')) return;
                isDragging = true;
                prevX = e.touches[0].clientX;
                prevY = e.touches[0].clientY;
            });

            window.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                let touch = null;
                for (let i = 0; i < e.touches.length; i++) {
                    if (e.touches[i].clientX > window.innerWidth / 3) {
                        touch = e.touches[i];
                        break;
                    }
                }
                if (!touch) return;

                let deltaX = touch.clientX - prevX;
                let deltaY = touch.clientY - prevY;
                prevX = touch.clientX;
                prevY = touch.clientY;

                yaw -= deltaX * 0.005;
                pitch -= deltaY * 0.005;
                pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
            });

            window.addEventListener('touchend', () => { isDragging = false; });

            window.addEventListener('mousedown', (e) => {
                if (e.target.closest('#hotbar') || e.target.closest('.action-btns')) return;
                document.body.requestPointerLock();
            });

            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === document.body) {
                    yaw -= e.movementX * 0.003;
                    pitch -= e.movementY * 0.003;
                    pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
                }
            });

            document.getElementById('jump-btn').addEventListener('touchstart', () => {
                if (position.y <= 2.1) velocity.y = 0.13;
            });

            document.getElementById('build-btn').addEventListener('touchstart', () => {
                performInteraction(true);
            });

            window.addEventListener('click', () => {
                if (document.pointerLockElement === document.body) {
                    performInteraction(false);
                }
            });
        }

        function performInteraction(isBuilding) {
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(blocks);

            if (intersects.length > 0) {
                const intersect = intersects[0];
                if (isBuilding) {
                    const pos = intersect.object.position.clone().add(intersect.face.normal);
                    createBlock(pos.x, pos.y, pos.z, blockColors[selectedMaterialIndex]);
                } else {
                    scene.remove(intersect.object);
                    blocks = blocks.filter(b => b !== intersect.object);
                }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            let speed = 0.09;
            let dir = new THREE.Vector3(moveVector.x, 0, moveVector.y);
            dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
            
            position.x += dir.x * speed;
            position.z += dir.z * speed;

            velocity.y -= 0.006;
            position.y += velocity.y;
            if (position.y < 2) {
                position.y = 2;
                velocity.y = 0;
            }

            camera.position.copy(position);
            
            let euler = new THREE.Euler(pitch, yaw
