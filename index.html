<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Echo Gravity Nexus</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #38bdf8;
            background: rgba(15, 23, 42, 0.9);
            padding: 12px 18px;
            border-radius: 12px;
            border: 2px solid #38bdf8;
            pointer-events: none;
            z-index: 10;
        }
        #ui h1 { margin: 0 0 3px 0; font-size: 16px; }
        #ui p { margin: 0; font-size: 11px; color: #94a3b8; }
        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 14px; height: 14px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            border: 3px solid #38bdf8;
            border-radius: 50%;
            z-index: 5;
        }
        #hotbar {
            position: absolute;
            bottom: 25px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 8px;
            background: rgba(15, 23, 42, 0.95);
            padding: 10px; border-radius: 14px;
            border: 2px solid #38bdf8;
            z-index: 10;
        }
        .slot {
            width: 42px; height: 42px;
            border: 2px solid #475569;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }
        .slot.active { border-color: #38bdf8; transform: scale(1.15); }
        .slot-color { width: 26px; height: 26px; border-radius: 6px; }
        #joystick-zone {
            position: absolute; bottom: 90px; left: 20px;
            width: 120px; height: 120px;
            background: rgba(56, 189, 248, 0.1);
            border: 2px solid #38bdf8;
            border-radius: 50%; z-index: 10;
        }
        #joystick-knob {
            position: absolute; top: 35px; left: 35px;
            width: 50px; height: 50px;
            background: rgba(56, 189, 248, 0.5);
            border-radius: 50%; pointer-events: none;
        }
        .action-btns {
            position: absolute; bottom: 90px; right: 20px;
            display: flex; flex-direction: column; gap: 12px; z-index: 10;
        }
        .action-btn {
            width: 60px; height: 60px;
            background: rgba(56, 189, 248, 0.2);
            border: 2px solid #38bdf8;
            color: #38bdf8; font-weight: bold;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui">
        <h1>Echo Gravity Nexus</h1>
        <p>عالم النيون المضيء | جرب أزرار الحلبة بالأسفل</p>
    </div>
    <div id="crosshair"></div>
    
    <div id="hotbar">
        <div class="slot active" onclick="selectBlock(0)"><div class="slot-color" style="background:#00ffff"></div></div>
        <div class="slot" onclick="selectBlock(1)"><div class="slot-color" style="background:#ff00ff"></div></div>
        <div class="slot" onclick="selectBlock(2)"><div class="slot-color" style="background:#ffff00"></div></div>
        <div class="slot" onclick="selectBlock(3)"><div class="slot-color" style="background:#ff3300"></div></div>
        <div class="slot" onclick="selectBlock(4)"><div class="slot-color" style="background:#00ff66"></div></div>
        <div class="slot" onclick="selectBlock(5)"><div class="slot-color" style="background:#ffffff"></div></div>
        <div class="slot" onclick="selectBlock(6)"><div class="slot-color" style="background:#9900ff"></div></div>
        <div class="slot" onclick="selectBlock(7)"><div class="slot-color" style="background:#ff9900"></div></div>
    </div>

    <div id="joystick-zone"><div id="joystick-knob"></div></div>
    <div class="action-btns">
        <div class="action-btn" id="jump-btn">قفز</div>
        <div class="action-btn" id="build-btn" style="background: rgba(255,0,255,0.2); border-color: #ff00ff; color: #ff00ff;">بناء</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, blocks = [], raycaster;
        let selectedMaterialIndex = 0;
        const blockColors = [0x00ffff, 0xff00ff, 0xffff00, 0xff3300, 0x00ff66, 0xffffff, 0x9900ff, 0xff9900];
        let moveVector = new THREE.Vector2(0, 0);
        let velocity = new THREE.Vector3();
        let position = new THREE.Vector3(0, 15, 12);
        let pitch = 0, yaw = 0;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020617);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // إضاءة ساطعة وقوية لضمان ظهور الألوان بوضوح تامة
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(20, 50, 20);
            scene.add(dirLight);

            raycaster = new THREE.Raycaster();

            // بناء عالم نيون واضح وملون
            for (let x = -10; x <= 10; x++) {
                for (let z = -10; z <= 10; z++) {
                    let h = Math.floor(Math.sin(x * 0.4) * Math.cos(z * 0.4) * 3) + 3;
                    for (let y = 0; y <= h; y++) {
                        let colorIdx = (y === h) ? 0 : (y > 2 ? 1 : 2);
                        if (Math.random() < 0.1 && y === h) colorIdx = Math.floor(Math.random() * blockColors.length);
                        createBlock(x, y, z, blockColors[colorIdx]);
                    }
                }
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            setupControls();
        }

        function createBlock(x, y, z, colorHex) {
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            // استخدام MeshBasicMaterial لضمان أن الألوان مضيئة وساطعة بدون الحاجة لتأثيرات إضاءة معقدة
            const material = new THREE.MeshBasicMaterial({ color: colorHex });
            const cube = new THREE.Mesh(geometry, material);
            cube.position.set(x, y, z);
            scene.add(cube);
            blocks.push(cube);
        }

        function selectBlock(index) {
            selectedMaterialIndex = index;
            document.querySelectorAll('.slot').forEach((s, i) => {
                if (i === index) s.classList.add('active');
                else s.classList.remove('active');
            });
        }

        function setupControls() {
            const zone = document.getElementById('joystick-zone');
            const knob = document.getElementById('joystick-knob');
            let jTouch = null;

            zone.addEventListener('touchstart', (e) => {
                if (jTouch === null) {
                    jTouch = e.changedTouches[0].identifier;
                    updateJoy(e.changedTouches[0]);
                }
            });
            zone.addEventListener('touchmove', (e) => {
                for (let t of e.changedTouches) if (t.identifier === jTouch) updateJoy(t);
            });
            const endJoy = (e) => {
                for (let t of e.changedTouches) if (t.identifier === jTouch) {
                    jTouch = null; moveVector.set(0, 0); knob.style.transform = `translate(0px, 0px)`;
                }
            };
            zone.addEventListener('touchend', endJoy);

            function updateJoy(t) {
                let rect = zone.getBoundingClientRect();
                let dx = t.clientX - (rect.left + rect.width / 2);
                let dy = t.clientY - (rect.top + rect.height / 2);
                let dist = Math.sqrt(dx*dx + dy*dy), maxD = 40;
                if (dist > maxD) { dx = (dx/dist)*maxD; dy = (dy/dist)*maxD; }
                knob.style.transform = `translate(${dx}px, ${dy}px)`;
                moveVector.set(dx/maxD, dy/maxD);
            }

            let dragging = false, px = 0, py = 0;
            window.addEventListener('touchstart', (e) => {
                if (e.target.closest('#joystick-zone') || e.target.closest('#hotbar') || e.target.closest('.action-btns')) return;
                dragging = true; px = e.touches[0].clientX; py = e.touches[0].clientY;
            });
            window.addEventListener('touchmove', (e) => {
                if (!dragging) return;
                let t = Array.from(e.touches).find(item => item.clientX > window.innerWidth / 3);
                if (!t) return;
                yaw -= (t.clientX - px) * 0.005;
                pitch -= (t.clientY - py) * 0.005;
                pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
                px = t.clientX; py = t.clientY;
            });
            window.addEventListener('touchend', () => { dragging = false; });

            document.getElementById('jump-btn').addEventListener('touchstart', () => {
                if (position.y <= 2.1) velocity.y = 0.13;
            });

            document.getElementById('build-btn').addEventListener('touchstart', () => {
                raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
                let hits = raycaster.intersectObjects(blocks);
                if (hits.length > 0) {
                    let hit = hits[0];
                    let p = hit.object.position.clone().add(hit.face.normal);
                    createBlock(p.x, p.y, p.z, blockColors[selectedMaterialIndex]);
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            let speed = 0.09;
            let dir = new THREE.Vector3(moveVector.x, 0, moveVector.y).applyAxisAngle(new THREE.Vector3(0,1,0), yaw);
            position.x += dir.x * speed;
            position.z += dir.z * speed;

            velocity.y -= 0.006;
            position.y += velocity.y;
            if (position.y < 2) { position.y = 2; velocity.y = 0; }

            camera.position.copy(position);
            camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
