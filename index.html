<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo-Gravity: Nexus | أبطال حقيقيون</title>
    <style>
        body {
            margin: 0;
            background: #05070d;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        canvas {
            background: #0f172a;
            border: 2px solid #00ffff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.4);
            border-radius: 12px;
            max-width: 95vw;
            max-height: 58vh;
        }
        .ui {
            margin-bottom: 5px;
            text-align: center;
        }
        h1 {
            margin: 0 0 2px 0;
            font-size: 16px;
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
        }
        p {
            margin: 0;
            font-size: 11px;
            color: #94a3b8;
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-top: 12px;
        }
        .btn-game {
            background: linear-gradient(135deg, #ff0055, #cc0044);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 40px;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
            cursor: pointer;
            outline: none;
        }
        .btn-shoot {
            background: linear-gradient(135deg, #00f0ff, #0077ff);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
            color: #05070d;
        }
        .btn-game:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="ui">
        <h1>Echo-Gravity: Nexus (Battle Royale Edition)</h1>
        <p>استخدم الأزرار للتحكم بالبطل الحقيقي وإطلاق النار على الأعداء!</p>
    </div>

    <canvas id="gameCanvas" width="800" height="360"></canvas>

    <div class="controls">
        <button class="btn-game" onclick="toggleGravity()">🔄 قلب الجاذبية</button>
        <button class="btn-game btn-shoot" onclick="shootBullet()">🔥 إطلاق نار</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // تحميل صور الشخصيات الحقيقية من الويب
        const playerImg = new Image();
        playerImg.src = "https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=100&h=100&fit=crop"; // صورة بطل حقيقي

        const enemyImg = new Image();
        enemyImg.src = "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop"; // صورة عدو حقيقي

        let player = {
            x: 80,
            y: 270,
            width: 45,
            height: 55,
            vy: 0,
            gravity: 0.5,
            isFlipped: false,
            hp: 100
        };

        let bullets = [];
        let enemies = [
            { x: 600, y: 270, width: 45, height: 55, hp: 50, speed: 2.2 }
        ];

        let score = 0;

        function toggleGravity() {
            player.isFlipped = !player.isFlipped;
            player.gravity = -player.gravity;
        }

        function shootBullet() {
            bullets.push({
                x: player.x + player.width,
                y: player.y + 20,
                width: 18,
                height: 6,
                speed: 9
            });
        }

        function update() {
            player.y += player.vy;
            player.vy += player.gravity;

            if (!player.isFlipped && player.y > 270) {
                player.y = 270;
                player.vy = 0;
            } else if (player.isFlipped && player.y < 45) {
                player.y = 45;
                player.vy = 0;
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].x += bullets[i].speed;
                if (bullets[i].x > canvas.width) {
                    bullets.splice(i, 1);
                }
            }

            enemies.forEach((enemy) => {
                enemy.x -= enemy.speed;
                if (enemy.x < -60) {
                    enemy.x = canvas.width + Math.random() * 250;
                    enemy.y = Math.random() > 0.5 ? 270 : 45;
                    enemy.hp = 50;
                }

                bullets.forEach((bullet, bIndex) => {
                    if (
                        bullet.x < enemy.x + enemy.width &&
                        bullet.x + bullet.width > enemy.x &&
                        bullet.y < enemy.y + enemy.height &&
                        bullet.y + bullet.height > enemy.y
                    ) {
                        enemy.hp -= 25;
                        bullets.splice(bIndex, 1);
                        if (enemy.hp <= 0) {
                            score += 100;
                            enemy.x = canvas.width + 300;
                            enemy.hp = 50;
                        }
                    }
                });
            });
        }

        function draw() {
            ctx.fillStyle = "#0f172a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // حدود الأرض والسقف
            ctx.strokeStyle = "#00ffff";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, 45); ctx.lineTo(canvas.width, 45);
            ctx.moveTo(0, 325); ctx.lineTo(canvas.width, 325);
            ctx.stroke();

            // رسم البطل الحقيقي بالصورة
            ctx.save();
            if (player.isFlipped) {
                ctx.translate(player.x + player.width / 2, player.y + player.height / 2);
                ctx.scale(1, -1);
                ctx.drawImage(playerImg, -player.width / 2, -player.height / 2, player.width, player.height);
            } else {
                ctx.drawImage(playerImg, player.x, player.y, player.width, player.height);
            }
            ctx.restore();

            // رسم العدو الحقيقي بالصورة وشريط الصحة
            enemies.forEach(enemy => {
                ctx.drawImage(enemyImg, enemy.x, enemy.y, enemy.width, enemy.height);
                
                ctx.fillStyle = "#ff0000";
                ctx.fillRect(enemy.x, enemy.y - 10, enemy.width, 4);
                ctx.fillStyle = "#00ff00";
                ctx.fillRect(enemy.x, enemy.y - 10, (enemy.width * (enemy.hp / 50)), 4);
            });

            // رسم الطلقات
            bullets.forEach(bullet => {
                ctx.fillStyle = "#00ffff";
                ctx.shadowColor = "#00ffff";
                ctx.shadowBlur = 10;
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
            });

            // واجهة النقاط
            ctx.fillStyle = "#fff";
            ctx.font = "bold 15px Arial";
            ctx.fillText("النقاط: " + score, 20, 28);
            ctx.fillText("صحة البطل: " + player.hp + "%", canvas.width - 150, 28);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
