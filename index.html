<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo-Gravity: Nexus | عالم المكعبات</title>
    <style>
        body {
            margin: 0;
            background: #0f172a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        canvas {
            background: #1e293b;
            border: 2px solid #10b981;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.4);
            border-radius: 12px;
            max-width: 95vw;
            max-height: 60vh;
        }
        .ui {
            margin-bottom: 8px;
            text-align: center;
        }
        h1 {
            margin: 0 0 3px 0;
            font-size: 16px;
            color: #34d399;
            text-shadow: 0 0 10px rgba(52, 211, 153, 0.6);
        }
        p {
            margin: 0;
            font-size: 11px;
            color: #94a3b8;
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }
        .btn-game {
            background: linear-gradient(135deg, #059669, #10b981);
            color: white;
            border: none;
            padding: 14px 26px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 40px;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.5);
            cursor: pointer;
            outline: none;
        }
        .btn-action {
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }
        .btn-game:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="ui">
        <h1>Echo-Gravity: Nexus (Voxel Craft)</h1>
        <p>عالم مكعبات، بناء، وقلب الجاذبية الفوري!</p>
    </div>

    <canvas id="gameCanvas" width="800" height="380"></canvas>

    <div class="controls">
        <button class="btn-game" onclick="toggleGravity()">🔄 قلب الجاذبية</button>
        <button class="btn-game btn-action" onclick="spawnBox()">📦 بناء صندوق</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // البطل بتصميم المكعبات (Voxel Character)
        let player = {
            x: 100,
            y: 280,
            width: 32,
            height: 48,
            vy: 0,
            gravity: 0.5,
            isFlipped: false,
            color: "#3b82f6"
        };

        // صناديق العالم والموارد (مثل ماينكرافت)
        let worldBoxes = [
            { x: 300, y: 300, width: 35, height: 35 },
            { x: 500, y: 280, width: 35, height: 55 },
            { x: 650, y: 260, width: 35, height: 75 }
        ];

        let score = 0;

        function toggleGravity() {
            player.isFlipped = !player.isFlipped;
            player.gravity = -player.gravity;
        }

        function spawnBox() {
            worldBoxes.push({
                x: player.x + 60,
                y: player.isFlipped ? 60 : 280,
                width: 35,
                height: 35
            });
            score += 10;
        }

        function update() {
            player.y += player.vy;
            player.vy += player.gravity;

            if (!player.isFlipped && player.y > 280) {
                player.y = 280;
                player.vy = 0;
            } else if (player.isFlipped && player.y < 50) {
                player.y = 50;
                player.vy = 0;
            }

            // تحريك الصناديق لتشكل عالماً متحركاً
            worldBoxes.forEach(box => {
                box.x -= 1.5;
                if (box.x < -50) {
                    box.x = canvas.width + 50;
                    box.y = Math.random() > 0.5 ? 280 : 60;
                }
            });
        }

        function draw() {
            // خلفية عالم المكعبات
            ctx.fillStyle = "#1e293b";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // أرضية وسقف العالم
            ctx.fillStyle = "#065f46";
            ctx.fillRect(0, 0, canvas.width, 50); // السقف
            ctx.fillRect(0, 328, canvas.width, 52); // الأرضية

            // رسم صناديق ومكعبات العالم (Voxel Style)
            worldBoxes.forEach(box => {
                ctx.fillStyle = "#10b981";
                ctx.fillRect(box.x, box.y, box.width, box.height);
                // تأثير ثلاثي الأبعاد للمكعب
                ctx.fillStyle = "#059669";
                ctx.fillRect(box.x, box.y, box.width, 8);
            });

            // رسم البطل (شخصية المكعبات)
            ctx.save();
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            
            // رأس البطل
            ctx.fillStyle = "#fde047";
            ctx.fillRect(player.x + 4, player.isFlipped ? player.y + 32 : player.y - 12, 24, 14);
            ctx.restore();

            // النقاط
            ctx.fillStyle = "#fff";
            ctx.font = "bold 15px Arial";
            ctx.fillText("النقاط والموارد: " + score, 25, 32);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
