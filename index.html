  <style>

  <script>
    // --- Canvas & Core Setup ---
    const container = document.getElementById('game-container');
    const startBtn = document.getElementById('start-btn');
    const instructions = document.getElementById('instructions');
    const hotbarContainer = document.getElementById('hotbar');
    const fpsCounter = document.getElementById('fps-counter');
    const posInfo = document.getElementById('pos-info');

    let scene, camera, renderer;
    let blocks = {}; // key: "x,y,z", value: mesh
    let blockTextures = {};
    let activeBlockType = 1; // Default selected block

    // Physics & Player State
    const player = {
      height: 1.7,
      radius: 0.4,
      velocity: new THREE.Vector3(),
      onGround: false,
      speed: 8.0,
      jumpForce: 7.5,
      gravity: 20.0
    };

    let controlsEnabled = false;
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, isJumping = false;
    let prevTime = performance.now();

    // Raycasting for target block interaction
    const raycaster = new THREE.Raycaster();
    raycaster.far = 8; // reach distance
    const mouseCenter = new THREE.Vector2(0, 0);
    let highlightMesh;

    // Block Definitions
    const BLOCK_TYPES = {
      1: { name: 'عشب', color: 0x557a2b, topColor: 0x66aa33, sideColor: 0x557a2b },
      2: { name: 'تراب', color: 0x795548 },
      3: { name: 'حجر', color: 0x757575 },
      4: { name: 'خشب', color: 0x5d4037 },
      5: { name: 'أوراق', color: 0x2e7d32, transparent: true, opacity: 0.85 },
      6: { name: 'طوب', color: 0x8d6e63 },
      7: { name: 'رمل', color: 0xe0c068 },
      8: { name: 'زجاج', color: 0x81d4fa, transparent: true, opacity: 0.5 }
    };

    // Camera Rotation Logic (Pointer Lock / Touch)
    let pitch = 0, yaw = 0;

    // Detect Mobile Device
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

    function init() {
      // Scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87ceeb); // Sky blue
      scene.fog = new THREE.FogExp2(0x87ceeb, 0.025);

      // Camera
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 10, 0);

      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      // Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
      dirLight.position.set(50, 80, 30);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 1024;
      dirLight.shadow.mapSize.height = 1024;
      dirLight.shadow.camera.near = 0.5;
      dirLight.shadow.camera.far = 150;
      const d = 40;
      dirLight.shadow.camera.left = -d;
      dirLight.shadow.camera.right = d;
      dirLight.shadow.camera.top = d;
      dirLight.shadow.camera.bottom = -d;
      scene.add(dirLight);

      // Highlight Wireframe Box for targeted block
      const highlightGeo = new THREE.BoxGeometry(1.01, 1.01, 1.01);
      const highlightMat = new THREE.MeshBasicMaterial({ color: 0x000000, wireframe: true });
      highlightMesh = new THREE.Mesh(highlightGeo, highlightMat);
      highlightMesh.visible = false;
      scene.add(highlightMesh);

      // Create Textures & Materials
      createBlockMaterials();

      // Create Hotbar UI
      createHotbar();

      // World Generation
      generateWorld();

      // Setup Controls & Events
      setupEventListeners();

      if (isMobile) {
        document.getElementById('mobile-controls').classList.remove('hidden');
      }

      // Resize Listener
      window.addEventListener('resize', onWindowResize);

      // Start Game Loop
      animate();
    }

    // Canvas procedural textures for blocks
    function createProceduralTexture(type) {
      const canvas = document.createElement('canvas');
      canvas.width = 32;
      canvas.height = 32;
      const ctx = canvas.getContext('2d');

      const info = BLOCK_TYPES[type];
      const baseColor = new THREE.Color(info.color);

      ctx.fillStyle = `#${baseColor.getHexString()}`;
      ctx.fillRect(0, 0, 32, 32);

      // Add noise / pixel pattern
      for (let x = 0; x < 32; x += 4) {
        for (let y = 0; y < 32; y += 4) {
          const shade = (Math.random() - 0.5) * 0.15;
          const c = baseColor.clone().addScalar(shade);
          ctx.fillStyle = `#${c.getHexString()}`;
          ctx.fillRect(x, y, 4, 4);
        }
      }

      // Extra custom details
      if (type === 6) { // Brick pattern
        ctx.fillStyle = '#5d4037';
        ctx.fillRect(0, 15, 32, 2);
        ctx.fillRect(0, 31, 32, 2);
        ctx.fillRect(15, 0, 2, 16);
        ctx.fillRect(7, 16, 2, 16);
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.magFilter = THREE.NearestFilter;
      texture.minFilter = THREE.NearestFilter;
      return texture;
    }

    function createBlockMaterials() {
      Object.keys(BLOCK_TYPES).forEach(type => {
        const info = BLOCK_TYPES[type];
        const texture = createProceduralTexture(type);
        
        const matOptions = {
          map: texture,
          transparent: info.transparent || false,
          opacity: info.opacity || 1.0,
          roughness: 0.8
        };

        if (type == 1) { // Grass top/side material
          const topTexture = createProceduralTexture(1);
          const sideTexture = createProceduralTexture(2);
          
          blockTextures[type] = [
            new THREE.MeshStandardMaterial({ ...matOptions, map: sideTexture }), // right
            new THREE.MeshStandardMaterial({ ...matOptions, map: sideTexture }), // left
            new THREE.MeshStandardMaterial({ ...matOptions, map: topTexture, color: info.topColor }), // top
            new THREE.MeshStandardMaterial({ ...matOptions, map: sideTexture }), // bottom
            new THREE.MeshStandardMaterial({ ...matOptions, map: sideTexture }), // front
            new THREE.MeshStandardMaterial({ ...matOptions, map: sideTexture })  // back
          ];
        } else {
          blockTextures[type] = new THREE.MeshStandardMaterial(matOptions);
        }
      });
    }

    // Geometry shared for all blocks
    const boxGeometry = new THREE.BoxGeometry(1, 1, 1);

    function addBlock(x, y, z, type) {
      const key = `${x},${y},${z}`;
      if (blocks[key]) return;

      const mat = blockTextures[type];
      const mesh = new THREE.Mesh(boxGeometry, mat);
      mesh.position.set(x + 0.5, y + 0.5, z + 0.5);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.userData = { x, y, z, type };

      scene.add(mesh);
      blocks[key] = mesh;
    }

    function removeBlock(x, y, z) {
      const key = `${x},${y},${z}`;
      if (blocks[key]) {
        scene.remove(blocks[key]);
        blocks[key].geometry.dispose();
        delete blocks[key];
      }
    }

    // Procedural Voxel Terrain Generator
    function generateWorld() {
      const worldSize = 32;
      const heightScale = 6;

      for (let x = -worldSize / 2; x < worldSize / 2; x++) {
        for (let z = -worldSize / 2; z < worldSize / 2; z++) {
          // Simple procedural height generation using sine/cosine waves
          const n1 = Math.sin(x * 0.1) * Math.cos(z * 0.1);
          const n2 = Math.sin(x * 0.05 + z * 0.05);
          const height = Math.floor((n1 + n2) * heightScale);

          // Top grass block
          addBlock(x, height, z, 1);

          // Dirt underneath
          for (let y = height - 1; y >= height - 3; y--) {
            addBlock(x, y, z, 2);
          }

          // Stone base
          for (let y = height - 4; y >= -4; y--) {
            addBlock(x, y, z, 3);
          }

          // Random Trees
          if (Math.random() < 0.015 && x > -worldSize/2 + 3 && x < worldSize/2 - 3 && z > -worldSize/2 + 3 && z < worldSize/2 - 3) {
            createTree(x, height + 1, z);
          }
        }
      }
    }

    function createTree(x, startY, z) {
      const trunkHeight = 4 + Math.floor(Math.random() * 2);
      // Trunk
      for (let i = 0; i < trunkHeight; i++) {
        addBlock(x, startY + i, z, 4);
      }
      // Leaves
      const leafStartY = startY + trunkHeight - 1;
      for (let lx = -2; lx <= 2; lx++) {
        for (let lz = -2; lz <= 2; lz++) {
          for (let ly = 0; ly <= 2; ly++) {
            if (Math.abs(lx) === 2 && Math.abs(lz) === 2) continue; // round corners
            if (lx === 0 && lz === 0 && ly < 2) continue; // skip trunk center
            addBlock(x + lx, leafStartY + ly, z + lz, 5);
          }
        }
      }
    }

    // UI Hotbar Creation
    function createHotbar() {
      hotbarContainer.innerHTML = '';
      Object.keys(BLOCK_TYPES).forEach(id => {
        const slot = document.createElement('div');
        slot.className = `hotbar-slot w-10 h-10 md:w-12 md:h-12 rounded-xl flex items-center justify-center cursor-pointer border-2 border-white/20 bg-gray-800/80 transition-all ${id == activeBlockType ? 'active' : ''}`;
        
        // Color preview icon
        const colorHex = '#' + new THREE.Color(BLOCK_TYPES[id].color).getHexString();
        slot.innerHTML = `
          <div class="w-6 h-6 rounded-md shadow" style="background-color: ${colorHex}"></div>
          <span class="absolute bottom-0.5 right-1 text-[10px] text-gray-300 font-bold">${id}</span>
        `;

        slot.addEventListener('click', () => selectHotbarSlot(id));
        hotbarContainer.appendChild(slot);
      });
    }

    function selectHotbarSlot(id) {
      activeBlockType = parseInt(id);
      const slots = hotbarContainer.children;
      Array.from(slots).forEach((s, idx) => {
        if (idx + 1 == activeBlockType) {
          s.classList.add('active');
        } else {
          s.classList.remove('active');
        }
      });
    }

    // Setup Event Listeners
    function setupEventListeners() {
      // Start Game Pointer Lock
      startBtn.addEventListener('click', () => {
        instructions.style.display = 'none';
        controlsEnabled = true;
        if (!isMobile) {
          document.body.requestPointerLock();
        }
      });

      document.addEventListener('pointerlockchange', () => {
        if (document.pointerLockElement === document.body) {
          controlsEnabled = true;
        } else if (!isMobile) {
          controlsEnabled = false;
          instructions.style.display = 'flex';
        }
      });

      // Mouse Look
      document.addEventListener('mousemove', (e) => {
        if (!controlsEnabled) return;

        const movementX = e.movementX || 0;
        const movementY = e.movementY || 0;

        yaw -= movementX * 0.0025;
        pitch -= movementY * 0.0025;
        pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, pitch));

        updateCameraRotation();
      });

      // Keyboard input
      document.addEventListener('keydown', (e) => {
        if (!controlsEnabled) return;
        switch (e.code) {
          case 'KeyW': moveForward = true; break;
          case 'KeyS': moveBackward = true; break;
          case 'KeyA': moveLeft = true; break;
          case 'KeyD': moveRight = true; break;
          case 'Space': if (player.onGround) { player.velocity.y = player.jumpForce; player.onGround = false; } break;
          default:
            if (e.key >= '1' && e.key <= '8') {
              selectHotbarSlot(e.key);
            }
            break;
        }
      });

      document.addEventListener('keyup', (e) => {
        switch (e.code) {
          case 'KeyW': moveForward = false; break;
          case 'KeyS': moveBackward = false; break;
          case 'KeyA': moveLeft = false; break;
          case 'KeyD': moveRight = false; break;
        }
      });

      // Block Actions (Mine & Place)
      document.addEventListener('mousedown', (e) => {
        if (!controlsEnabled) return;
        if (e.button === 0) performBlockAction('mine'); // Left click
        if (e.button === 2) performBlockAction('place'); // Right click
      });

      // Prevent Context Menu on Right-Click
      document.addEventListener('contextmenu', e => e.preventDefault());

      // Mobile Touch Actions
      let touchStartX = 0, touchStartY = 0;
      document.addEventListener('touchstart', (e) => {
        if (!controlsEnabled || e.touches.length === 0) return;
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      });

      document.addEventListener('touchmove', (e) => {
        if (!controlsEnabled || e.touches.length === 0) return;
        const deltaX = e.touches[0].clientX - touchStartX;
        const deltaY = e.touches[0].clientY - touchStartY;

        yaw -= deltaX * 0.005;
        pitch -= deltaY * 0.005;
        pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, pitch));

        updateCameraRotation();

        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      });

      // Mobile Touch Buttons
      document.getElementById('btn-break').addEventListener('click', () => performBlockAction('mine'));
      document.getElementById('btn-place').addEventListener('click', () => performBlockAction('place'));
      document.getElementById('btn-jump').addEventListener('click', () => {
        if (player.onGround) {
          player.velocity.y = player.jumpForce;
          player.onGround = false;
        }
      });

      // Fullscreen Toggle
      document.getElementById('fullscreen-btn').addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen();
        } else {
          document.exitFullscreen();
        }
      });
    }

    function updateCameraRotation() {
      const euler = new THREE.Euler(0, 0, 0, 'YXZ');
      euler.x = pitch;
      euler.y = yaw;
      camera.quaternion.setFromEuler(euler);
    }

    // Raycast to find target block
    function updateRaycast() {
      raycaster.setFromCamera(mouseCenter, camera);
      const intersects = raycaster.intersectObjects(Object.values(blocks));

      if (intersects.length > 0) {
        const hit = intersects[0];
        const b = hit.object.userData;
        highlightMesh.position.set(b.x + 0.5, b.y + 0.5, b.z + 0.5);
        highlightMesh.visible = true;
        return hit;
      } else {
        highlightMesh.visible = false;
        return null;
      }
    }

    function performBlockAction(action) {
      const hit = updateRaycast();
      if (!hit) return;

      const b = hit.object.userData;

      if (action === 'mine') {
        removeBlock(b.x, b.y, b.z);
      } else if (action === 'place') {
        // Calculate new block position using face normal
        const normal = hit.face.normal;
        const nx = b.x + Math.round(normal.x);
        const ny = b.y + Math.round(normal.y);
        const nz = b.z + Math.round(normal.z);

        // Check player bounding collision before placing
        const pMinX = Math.floor(camera.position.x - player.radius);
        const pMaxX = Math.floor(camera.position.x + player.radius);
        const pMinY = Math.floor(camera.position.y - player.height);
        const pMaxY = Math.floor(camera.position.y);
        const pMinZ = Math.floor(camera.position.z - player.radius);
        const pMaxZ = Math.floor(camera.position.z + player.radius);

        if (nx >= pMinX && nx <= pMaxX && ny >= pMinY && ny <= pMaxY && nz >= pMinZ && nz <= pMaxZ) {
          return; // Don't place inside player
        }

        addBlock(nx, ny, nz, activeBlockType);
      }
    }

    // Simple Collision Detection
    function checkCollision(position) {
      const minX = Math.floor(position.x - player.radius);
      const maxX = Math.floor(position.x + player.radius);
      const minY = Math.floor(position.y - player.height);
      const maxY = Math.floor(position.y);
      const minZ = Math.floor(position.z - player.radius);
      const maxZ = Math.floor(position.z + player.radius);

      for (let x = minX; x <= maxX; x++) {
        for (let y = minY; y <= maxY; y++) {
          for (let z = minZ; z <= maxZ; z++) {
            if (blocks[`${x},${y},${z}`]) {
              return true;
            }
          }
        }
      }
      return false;
    }

    // Physics Update Loop
    function updatePlayer(delta) {
      if (!controlsEnabled) return;

      // Apply Gravity
      player.velocity.y -= player.gravity * delta;

      // Calculate Movement Vectors relative to camera direction
      const frontVector = new THREE.Vector3(0, 0, (moveBackward ? 1 : 0) - (moveForward ? 1 : 0));
      const sideVector = new THREE.Vector3((moveLeft ? 1 : 0) - (moveRight ? 1 : 0), 0, 0);

      const direction = new THREE.Vector3();
      direction.subVectors(frontVector, sideVector).normalize();
      direction.applyEuler(new THREE.Euler(0, yaw, 0)); // only yaw rotation for movement

      // Movement Horizontal
      const moveX = direction.x * player.speed * delta;
      const moveZ = direction.z * player.speed * delta;

      // Move along X with collision
      camera.position.x += moveX;
      if (checkCollision(camera.position)) {
        camera.position.x -= moveX;
      }

      // Move along Z with collision
      camera.position.z += moveZ;
      if (checkCollision(camera.position)) {
        camera.position.z -= moveZ;
      }

      // Move along Y (Gravity & Jump) with collision
      const moveY = player.velocity.y * delta;
      camera.position.y += moveY;

      if (checkCollision(camera.position)) {
        camera.position.y -= moveY;
        if (player.velocity.y < 0) {
          player.onGround = true;
        }
        player.velocity.y = 0;
      } else {
        player.onGround = false;
      }

      // Fall off world reset safety
      if (camera.position.y < -30) {
        camera.position.set(0, 15, 0);
        player.velocity.set(0, 0, 0);
      }

      // Update UI Info
      posInfo.innerText = `${Math.floor(camera.position.x)}, ${Math.floor(camera.position.y)}, ${Math.floor(camera.position.z)}`;
    }

    // Window Resize Handler
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // FPS Counter variables
    let frameCount = 0;
    let lastFpsUpdate = performance.now();

    // Main Game Animation Loop
    function animate() {
      requestAnimationFrame(animate);

      const time = performance.now();
      const delta = Math.min((time - prevTime) / 1000, 0.1);
      prevTime = time;

      // Update Physics
      updatePlayer(delta);

      // Update Highlighted Box Target
      if (controlsEnabled) {
        updateRaycast();
      }

      // Render Scene
      renderer.render(scene, camera);

      // Update FPS UI
      frameCount++;
      if (time - lastFpsUpdate >= 1000) {
        fpsCounter.innerText = frameCount;
        frameCount = 0;
        lastFpsUpdate = time;
      }
    }

    // Start Everything on Load
    window.onload = () => {
      init();
    };
  </script>
</body>
</html>
