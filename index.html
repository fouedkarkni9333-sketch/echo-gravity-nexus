<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Reaction Blitz ⚡ - Global Edition</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #090d16;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 10px;
      overflow: hidden;
    }

    .shake {
      animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes shake {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }

    .game-card {
      background: #1e293b;
      border: 3px solid #38bdf8;
      border-radius: 20px;
      padding: 20px;
      width: 100%;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.2);
      position: relative;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      background: #0f172a;
      padding: 10px 18px;
      border-radius: 12px;
      border: 1px solid #334155;
    }
    .score-info {
      display: flex;
      gap: 15px;
      font-size: 1.1rem;
      font-weight: 800;
    }
    .settings-btn {
      background: #334155;
      border: 1px solid #475569;
      color: #fff;
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 1.2rem;
      transition: all 0.2s;
    }
    .settings-btn:hover {
      background: #475569;
    }
    .camera-box {
      position: relative;
      width: 100%;
      height: 300px;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid #475569;
      background: #000;
    }
    video, canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    .command-overlay {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid #facc15;
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 1.2rem;
      font-weight: 900;
      color: #facc15;
      white-space: nowrap;
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
    }
    .timer-bar-container {
      width: 100%;
      height: 14px;
      background: #334155;
      border-radius: 7px;
      margin-top: 15px;
      overflow: hidden;
    }
    .timer-bar {
      width: 100%;
      height: 100%;
      background: #4ade80;
      transition: width 0.05s linear, background-color 0.2s;
    }
    .btn {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 14px 28px;
      font-size: 1.2rem;
      font-weight: 800;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 15px;
      transition: all 0.2s;
      width: 100%;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
    }
    .btn:hover {
      background: #7dd3fc;
      transform: translateY(-2px);
    }
    
    /* Overlays (Game Over & Settings) */
    .modal-overlay {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.96);
      border-radius: 20px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 10;
    }
    .fail-snapshot {
      width: 150px;
      height: 110px;
      border-radius: 10px;
      border: 3px solid #ef4444;
      margin: 10px 0;
      object-fit: cover;
      transform: scaleX(-1);
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
    }
    select {
      background: #0f172a;
      color: #38bdf8;
      border: 2px solid #38bdf8;
      padding: 10px 15px;
      font-size: 1rem;
      border-radius: 8px;
      width: 100%;
      max-width: 300px;
      margin-top: 10px;
      outline: none;
      font-weight: bold;
    }
  </style>
</head>

      fa: { ready: "آماده! استارت را بزنید 🚀", start: "شروع بازی 🔥", over: "پایان بازی! 💥", fail: "چهره شما هنگام باخت:", final: "امتیاز نهایی", tryAgain: "تلاش مجدد 🔄", close: "בبستن و ذخیره", MOUTH_OPEN: "😮 دهانت را باز کن!", BLINK_LEFT: "😉 چشم چپ را چشمک بزن!", BLINK_RIGHT: "😜 چشم راست را چشمک بزن!", BROWS_UP: "🤨 ابروها را بالا ببر!", TILT_LEFT: "👈 سر را به چپ خم کن!", TILT_RIGHT: "👉 سر را به راست خم کن!", success: "عالی! ⚡" }
    };

    let currentLang = "en";

    // Global Language UI update
    window.changeLanguage = function(lang) {
      currentLang = lang;
      const t = translations[lang] || translations.en;

      // Update text in UI
      document.getElementById("start-btn").innerText = t.start;
      document.getElementById("txt-gameover").innerText = t.over;
      document.getElementById("txt-failsnap").innerText = t.fail;
      document.getElementById("txt-finalscore").innerText = t.final;
      document.getElementById("btn-tryagain").innerText = t.tryAgain;
      document.querySelector("#settings-modal .btn").innerText = t.close;

      if (gameState === "IDLE") {
        document.getElementById("command-display").innerText = t.ready;
      }
      
      // Update page direction for RTL languages
      if (lang === 'ar' || lang === 'he' || lang === 'fa') {
        document.documentElement.dir = "rtl";
      } else {
        document.documentElement.dir = "ltr";
      }
    };

    window.openSettings = function() {
      document.getElementById("settings-modal").style.display = "flex";
    };

    window.closeSettings = function() {
      document.getElementById("settings-modal").style.display = "none";
    };

    // Camera & Logic Elements
    const video = document.getElementById("webcam");
    const mainCard = document.getElementById("main-card");
    const commandDisplay = document.getElementById("command-display");
    const timerBar = document.getElementById("timer-bar");
    const scoreText = document.getElementById("score");
    const highScoreText = document.getElementById("high-score");
    const finalScoreText = document.getElementById("final-score");
    const gameOverScreen = document.getElementById("game-over");
    const startBtn = document.getElementById("start-btn");
    const snapshotCanvas = document.getElementById("snapshot-canvas");

    let faceLandmarker;
    let lastVideoTime = -1;
    let gameState = "IDLE";
    let score = 0;
    let highScore = 0;
    let currentCommand = null;
    let timerInterval = null;
    let timeLimit = 2500;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'success') {
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      } else if (type === 'fail') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      }
    }

    const commandKeys = ["MOUTH_OPEN", "BLINK_LEFT", "BLINK_RIGHT", "BROWS_UP", "TILT_LEFT", "TILT_RIGHT"];

    async function init() {
      const filesetResolver = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
      );
      
      faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
        baseOptions: {
          modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`,
          delegate: "GPU"
        },
        outputFaceBlendshapes: true,
        runningMode: "VIDEO",
        numFaces: 1
      });

      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      video.srcObject = stream;
      video.addEventListener("loadeddata", () => {
        changeLanguage("en"); // English as Default
        startBtn.style.display = "block";
        predictLoop();
      });
    }

    window.startGame = function() {
      score = 0;
      scoreText.innerText = score;
      gameOverScreen.style.display = "none";
      startBtn.style.display = "none";
      gameState = "PLAYING";
      nextRound();
    };

    function nextRound() {
      const randomKey = commandKeys[Math.floor(Math.random() * commandKeys.length)];
      currentCommand = randomKey;
      
      const t = translations[currentLang] || translations.en;
      commandDisplay.innerText = t[randomKey];

      timeLimit = Math.max(1000, 2500 - (score * 90)); 
      startTimer();
    }

    function startTimer() {
      clearInterval(timerInterval);
      let startTime = Date.now();

      timerInterval = setInterval(() => {
        if (gameState !== "PLAYING") return;
        let elapsed = Date.now() - startTime;
        let remainingRatio = Math.max(0, (timeLimit - elapsed) / timeLimit);
        
        timerBar.style.width = (remainingRatio * 100) + "%";
        
        if (remainingRatio > 0.5) timerBar.style.backgroundColor = "#4ade80";
        else if (remainingRatio > 0.2) timerBar.style.backgroundColor = "#facc15";
        else timerBar.style.backgroundColor = "#ef4444";

        if (elapsed >= timeLimit) {
          endGame();
        }
      }, 30);
    }

    function checkSuccess(detectedAction) {
      if (gameState !== "PLAYING") return;

      if (detectedAction === currentCommand) {
        clearInterval(timerInterval);
        playSound('success');
        score++;
        scoreText.innerText = score;
        if (score > highScore) {
          highScore = score;
          highScoreText.innerText = highScore;
        }
        
        const t = translations[currentLang] || translations.en;
        commandDisplay.innerText = t.success;
        setTimeout(nextRound, 250);
      }
    }

    async function predictLoop() {
      if (video.currentTime !== lastVideoTime && faceLandmarker) {
        lastVideoTime = video.currentTime;
        const results = faceLandmarker.detectForVideo(video, performance.now());

        if (results.faceBlendshapes && results.faceBlendshapes.length > 0 && gameState === "PLAYING") {
          const shapes = results.faceBlendshapes[0].categories;
          
          const jawOpen = shapes.find(s => s.categoryName === "jawOpen")?.score || 0;
          const blinkLeft = shapes.find(s => s.categoryName === "eyeBlinkLeft")?.score || 0;
          const blinkRight = shapes.find(s => s.categoryName === "eyeBlinkRight")?.score || 0;
          const browOuterUpLeft = shapes.find(s => s.categoryName === "browOuterUpLeft")?.score || 0;

          const matrix = results.facialTransformationMatrixes?.[0]?.data;
          let headTilt = 0;
          if (matrix) headTilt = matrix[1];

          if (jawOpen > 0.45) checkSuccess("MOUTH_OPEN");
          else if (blinkLeft > 0.55 && blinkRight < 0.3) checkSuccess("BLINK_LEFT");
          else if (blinkRight > 0.55 && blinkLeft < 0.3) checkSuccess("BLINK_RIGHT");
          else if (browOuterUpLeft > 0.45) checkSuccess("BROWS_UP");
          else if (headTilt > 0.15) checkSuccess("TILT_LEFT");
          else if (headTilt < -0.15) checkSuccess("TILT_RIGHT");
        }
      }
      requestAnimationFrame(predictLoop);
    }

    function endGame() {
      clearInterval(timerInterval);
      gameState = "GAMEOVER";
      playSound('fail');

      snapshotCanvas.width = video.videoWidth;
      snapshotCanvas.height = video.videoHeight;
      const ctx = snapshotCanvas.getContext("2d");
      ctx.drawImage(video, 0, 0, snapshotCanvas.width, snapshotCanvas.height);

      mainCard.classList.add("shake");
      setTimeout(() => mainCard.classList.remove("shake"), 400);

      finalScoreText.innerText = score;
      gameOverScreen.style.display = "flex";
    }

    init();
  </script>
