<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Echo Gravity Nexus - Combat City</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #020617;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #38bdf8;
            background: rgba(15, 23, 42, 0.9);
            padding: 12px 18px;
            border-radius: 12px;
            border: 2px solid #38bdf8;
            pointer-events: none;
            z-index: 10;
        }
        #ui h1 { margin: 0 0 3px 0; font-size: 16px; }
        #ui p { margin: 0; font-size: 11px; color: #94a3b8; }
        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 16px; height: 16px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            border: 2px solid #ef4444;
            border-radius: 50%;
            z-index: 5;
        }
        #joystick-zone {
            position: absolute; bottom: 30px; left: 30px;
            width: 130px; height: 130px;
            background: rgba(56, 189, 248, 0.1);
            border: 2px solid #38bdf8;
            border-radius: 50%; z-index: 10;
        }
        #joystick-knob {
            position: absolute; top: 40px; left: 40px;
            width: 50px; height: 50px;
            background: rgba(56, 189, 248, 0.5);
            border-radius: 50%; pointer-events: none;
        }
        .action-btns {
            position: absolute; bottom: 30px; right: 30px;
            display: flex; flex-direction: column; gap: 12px; z-index: 10;
        }
        .action-btn {
            width: 65px; height: 65px;
            background: rgba(239, 68, 68, 0.2);
            border: 2px solid #ef4444;
            color: #ef4444; font-weight: bold; font-size: 14px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }
        .action-btn:active { background: rgba(239, 68, 68, 0.5); }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui">
        <h1>Echo Gravity Nexus</h1>
        <p>المدينة الكبرى للقتال | استكشف الشوارع والمباني</p>
    </div>
    <div id="crosshair"></div>
    
    <div id="joystick-zone"><div id="joystick-knob"></div></div>
    <div class="action-btns">
        <div class="action-btn" id="jump-btn">قفز</div>
        <div class="action-btn" id="fire-btn" style="background: rgba(56,189,248,0.2); border-color: #38bdf8; color: #38bdf8;">إطلاق</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, blocks = [], raycaster;
        let moveVector = new THREE.Vector2(0, 0);
        let velocity = new THREE.Vector3();
        let position = new THREE.Vector3(0, 5, 20);
        let pitch = 0, yaw = 0;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020617);
            scene.fog = new THREE.FogExp2(0x020617, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0x38bdf8, 1.5);
            dirLight.position.set(50, 100, 50);
            scene.add(dirLight);

            raycaster = new THREE.Raycaster();

            // بناء مدينة واسعة وكبيرة جداً (ناطحات سحاب وشوارع)
            const citySize = 30; // توسيع المدينة
            for (let x = -citySize; x <= citySize; x += 3) {
                for (let z = -citySize; z <= citySize; z += 3) {
                    // أرضية الشوارع والمدينة
                    createBlock(x, 0, z, 0x1e293b);
                    createBlock(x+1, 0, z, 0x1e293b);

                    // ترك مسافات للشوارع، وبناء مبانٍ شاهقة مختلفة الأطوال
                    if (Math.abs(x) > 4 || Math.abs(z) > 4) {
                        let buildingHeight = Math.floor(Math.abs(Math.sin(x * 0.5) * Math.cos(z * 0.5)) * 12) + 3;
                        for (let y = 1; y <= buildingHeight; y++) {
                            // ألوان نيون مختلفة للمباني والزجاج
                            let col = (y === buildingHeight) ? 0x38bdf8 : (y % 2 === 0 ? 0x0f172a : 0x334155);
                            createBlock(x, y, z, col);
                            createBlock(x+1, y, z, col);
                        }
                    }
                }
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            setupControls();
        }

        function createBlock(x, y, z, colorHex) {
            const geometry = new THREE.BoxGeometry(2, 1, 2);
            const material = new THREE.MeshBasicMaterial({ color: colorHex });
            const cube = new THREE.Mesh(geometry, material);
            cube.position.set(x, y, z);
            scene.add(cube);
            blocks.push(cube);
        }

        function setupControls() {
            const zone = document.getElementById('joystick-zone');
            const knob = document.getElementById('joystick-knob');
            let jTouch = null;

            zone.addEventListener('touchstart', (e) => {
                if (jTouch === null) {
                    jTouch = e.changedTouches[0].identifier;
                    updateJoy(e.changedTouches[0]);
                }
            });
            zone.addEventListener('touchmove', (e) => {
                for (let t of e.changedTouches) if (t.identifier === jTouch) updateJoy(t);
            });
            const endJoy = (e) => {
                for (let t of e.changedTouches) if (t.identifier === jTouch) {
                    jTouch = null; moveVector.set(0, 0); knob.style.transform = `translate(0px, 0px)`;
                }
            };
            zone.addEventListener('touchend', endJoy);

            function updateJoy(t) {
                let rect = zone.getBoundingClientRect();
                let dx = t.clientX - (rect.left + rect.width / 2);
                let dy = t.clientY - (rect.top + rect.height / 2);
                let dist = Math.sqrt(dx*dx + dy*dy), maxD = 45;
                if (dist > maxD) { dx = (dx/dist)*maxD; dy = (dy/dist)*maxD; }
                knob.style.transform = `translate(${dx}px, ${dy}px)`;
                moveVector.set(dx/maxD, dy/maxD);
            }

            let dragging = false, px = 0, py = 0;
            window.addEventListener('touchstart', (e) => {
                if (e.target.closest('#joystick-zone') || e.target.closest('.action-btns')) return;
                dragging = true; px = e.touches[0].clientX; py = e.touches[0].clientY;
            });
            window.addEventListener('touchmove', (e) => {
                if (!dragging) return;
                let t = Array.from(e.touches).find(item => item.clientX > window.innerWidth / 3);
                if (!t) return;
                yaw -= (t.clientX - px) * 0.005;
                pitch -= (t.clientY - py) * 0.005;
                pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
                px = t.clientX; py = t.clientY;
            });
            window.addEventListener('touchend', () => { dragging = false; });

            document.getElementById('jump-btn').addEventListener('touchstart', () => {
                if (position.y <= 2.1) velocity.y = 0.15;
            });

            document.getElementById('fire-btn').addEventListener('touchstart', () => {
                // تأثير إطلاق النار في المدينة
                alert("تم إطلاق طلقة طاقة في المدينة! جاهز لإضافة الأعداء.");
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            let speed = 0.12;
            let dir = new THREE.Vector3(moveVector.x, 0, moveVector.y).applyAxisAngle(new THREE.Vector3(0,1,0), yaw);
            position.x += dir.x * speed;
            position.z += dir.z * speed;

            velocity.y -= 0.006;
            position.y += velocity.y;
            if (position.y < 2) { position.y = 2; velocity.y = 0; }

            camera.position.copy(position);
            camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
