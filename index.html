<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Escape the Dark Maze - رعب الظلام</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            color: #f8fafc;
            background: rgba(10, 10, 15, 0.9);
            padding: 12px 18px;
            border-radius: 14px;
            border: 1px solid rgba(239, 68, 68, 0.5);
            pointer-events: none;
            z-index: 10;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(239,68,68,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #ui h1 { margin: 0; font-size: 15px; color: #ef4444; text-shadow: 0 0 8px rgba(239,68,68,0.6); }
        #ui p { margin: 0; font-size: 12px; color: #cbd5e1; }
        
        #joystick-zone {
            position: absolute; bottom: 30px; left: 30px;
            width: 130px; height: 130px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(239, 68, 68, 0.4);
            border-radius: 50%; z-index: 10;
            backdrop-filter: blur(8px);
        }
        #joystick-knob {
            position: absolute; top: 39px; left: 39px;
            width: 50px; height: 50px;
            background: linear-gradient(135deg, #ef4444, #991b1b);
            border-radius: 50%; pointer-events: none;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.6);
        }
        
        #game-over-screen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.92);
            z-index: 100; display: none;
            flex-direction: column; align-items: center; justify-content: center;
            color: #fff; text-align: center;
        }
        #game-over-screen h2 { font-size: 32px; color: #ef4444; margin-bottom: 10px; text-shadow: 0 0 15px rgba(239,68,68,0.8); }
        #game-over-screen p { font-size: 16px; color: #94a3b8; margin-bottom: 20px; }
        .restart-btn {
            background: #ef4444; color: white; border: none; padding: 12px 30px;
            font-size: 16px; font-weight: bold; border-radius: 10px; cursor: pointer;
            box-shadow: 0 5px 20px rgba(239, 68, 68, 0.5);
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="ui">
        <div>
            <h1>متاهة الظلام الدامس</h1>
            <p id="status-txt">المفاتيح المتبقية: 3</p>
        </div>
        <div>
            <p id="timer-txt" style="color: #ef4444; font-weight: bold; font-size: 14px;">الوقت: 60ث</p>
        </div>
    </div>

    <div id="joystick-zone"><div id="joystick-knob"></div></div>

    <div id="game-over-screen">
        <h2 id="end-title">انتهى الوقت!</h2>
        <p id="end-desc">لم تستطع الهروب من الظلام في الوقت المحدد.</p>
        <button class="restart-btn" onclick="resetGame()">إعادة المحاولة</button>
    </div>

    <!-- مكتبة Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let moveVector = new THREE.Vector2(0, 0);
        let playerPos = new THREE.Vector3(0, 0.8, 12);
        let camYaw = 0, camPitch = 0;
        let buildingBoxes = [];
        let keys = [];
        let keysLeft = 3;
        let timeLeft = 60;
        let gameActive = true;
        let timerInterval;
        let flashlight;

        const MAP_SIZE = 40;
        const PLAYER_RADIUS = 0.5;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020205);
            scene.fog = new THREE.FogExp2(0x020205, 0.08); // ضباب مظلم وكثيف يغطي الرؤية

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.copy(playerPos);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // إضاءة عامة خافتة جداً (ظلام دامس)
            const ambientLight = new THREE.AmbientLight(0x0a0a12, 0.3);
            scene.add(ambientLight);

            // مصباح يدوي مرعب مرتبط بكاميرا اللاعب
            flashlight = new THREE.SpotLight(0xffedd5, 2.5, 25, Math.PI / 5, 0.5, 1);
            flashlight.position.set(0, 0, 0);
            scene.add(flashlight);
            scene.add(flashlight.target);

            buildDarkMaze();
            spawnKeys();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            setupControls();
            startTimer();
        }

        function startTimer() {
            timeLeft = 60;
            gameActive = true;
            document.getElementById('game-over-screen').style.display = 'none';
            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                if (!gameActive) return;
                timeLeft--;
                document.getElementById('timer-txt').innerText = `الوقت: ${timeLeft}ث`;
                if (timeLeft <= 0) {
                    endGame(false);
                }
            }, 1000);
        }

        function buildDarkMaze() {
            // الأرضية
            const floorGeo = new THREE.PlaneGeometry(MAP_SIZE * 2, MAP_SIZE * 2);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x09090b, roughness: 0.9 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // السقف
            const ceiling = new THREE.Mesh(floorGeo, floorMat);
            ceiling.rotation.x = Math.PI / 2;
            ceiling.position.y = 4;
            scene.add(ceiling);

            // جدران المتاهة المظلمة
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x18181b, roughness: 0.8 });
            
            const wallConfigs = [
                {w: 30, h: 4, d: 1, x: 0, z: -15},
                {w: 1, h: 4, d: 30, x: -15, z: 0},
                {w: 1, h: 4, d: 30, x: 15, z: 0},
                {w: 30, h: 4, d: 1, x: 0, z: 15},
                // جدران داخلية للمتاهة
                {w: 12, h: 4, d: 1, x: -8, z: -5},
                {w: 1, h: 4, d: 10, x: -2, z: 5},
                {w: 10, h: 4, d: 1, x: 6, z: -6},
                {w: 1, h: 4, d: 12, x: 7, z: 4},
                {w: 8, h: 4, d: 1, x: -5, z: 8}
            ];

            wallConfigs.forEach(cfg => {
                let mesh = new THREE.Mesh(new THREE.BoxGeometry(cfg.w, cfg.h, cfg.d), wallMat);
                mesh.position.set(cfg.x, cfg.h / 2, cfg.z);
                scene.add(mesh);
                let box = new THREE.Box3().setFromObject(mesh);
                buildingBoxes.push(box);
            });
        }

        function spawnKeys() {
            const keyGeo = new THREE.OctahedronGeometry(0.4);
            const keyMat = new THREE.MeshBasicMaterial({ color: 0xeab308 }); // مفتاح ذهبي مضيء

            const positions = [
                {x: -12, z: -12},
                {x: 12, z: -10},
                {x: -10, z: 12}
            ];

            positions.forEach(pos => {
                let keyMesh = new THREE.Mesh(keyGeo, keyMat);
                keyMesh.position.set(pos.x, 0.8, pos.z);
                scene.add(keyMesh);
                keys.push(keyMesh);
            });
        }

        function setupControls() {
            const zone = document.getElementById('joystick-zone');
            const knob = document.getElementById('joystick-knob');
            let jTouch = null;

            zone.addEventListener('touchstart', (e) => {
                if (jTouch === null) {
                    jTouch = e.changedTouches[0].identifier;
                    updateJoy(e.changedTouches[0]);
                }
            });
            zone.addEventListener('touchmove', (e) => {
                for (let t of e.changedTouches) if (t.identifier === jTouch) updateJoy(t);
            });
            const endJoy = (e) => {
                for (let t of e.changedTouches) if (t.identifier === jTouch) {
                    jTouch = null; moveVector.set(0, 0); knob.style.transform = `translate(0px, 0px)`;
                }
            };
            zone.addEventListener('touchend', endJoy);

            function updateJoy(t) {
                let rect = zone.getBoundingClientRect();
                let dx = t.clientX - (rect.left + rect.width / 2);
                let dy = t.clientY - (rect.top + rect.height / 2);
                let dist = Math.sqrt(dx*dx + dy*dy), maxD = 45;
                if (dist > maxD) { dx = (dx/dist)*maxD; dy = (dy/dist)*maxD; }
                knob.style.transform = `translate(${dx}px, ${dy}px)`;
                moveVector.set(-dx / maxD, -dy / maxD);
            }

            // تدوير الكاميرا عبر السحب في الشاشة
            let dragging = false, px = 0, py = 0;
            window.addEventListener('touchstart', (e) => {
                if (e.target.closest('#joystick-zone')) return;
                dragging = true; px = e.touches[0].clientX; py = e.touches[0].clientY;
            });
            window.addEventListener('touchmove', (e) => {
                if (!dragging) return;
                let t = Array.from(e.touches).find(item => item.clientX > window.innerWidth / 3);
                if (!t) return;
                camYaw -= (t.clientX - px) * 0.004;
                camPitch -= (t.clientY - py) * 0.003;
                camPitch = Math.max(-0.4, Math.min(0.4, camPitch)); // تقييد النظر للأعلى والأسفل
                px = t.clientX; py = t.clientY;
            });
            window.addEventListener('touchend', () => { dragging = false; });
        }

        function checkCollision(pos) {
            let testBox = new THREE.Box3(
                new THREE.Vector3(pos.x - PLAYER_RADIUS, 0, pos.z - PLAYER_RADIUS),
                new THREE.Vector3(pos.x + PLAYER_RADIUS, 2, pos.z + PLAYER_RADIUS)
            );
            for (let box of buildingBoxes) {
                if (box.intersectsBox(testBox)) return true;
            }
            return false;
        }

        function endGame(won) {
            gameActive = false;
            clearInterval(timerInterval);
            let screen = document.getElementById('game-over-screen');
            let title = document.getElementById('end-title');
            let desc = document.getElementById('end-desc');

            if (won) {
                title.style.color = '#10b981';
                title.innerText = "لقد نجوت!";
                desc.innerText = "هنيئاً لك، جمعت كل المفاتيح وهربت من المتاهة المظلمة!";
            } else {
                title.style.color = '#ef4444';
                title.innerText = "انتهى الوقت!";
                desc.innerText = "ابتلعك الظلام.. حاول مرة أخرى بسرعة!";
            }
            screen.style.display = 'flex';
        }

        function resetGame() {
            playerPos.set(0, 0.8, 12);
            camYaw = 0; camPitch = 0;
            keysLeft = 3;
            document.getElementById('status-txt').innerText = `المفاتيح المتبقية: ${keysLeft}`;
            
            // إعادة توزيع المفاتيح
            keys.forEach(k => scene.remove(k));
            keys = [];
            spawnKeys();
            startTimer();
        }

        function animate() {
            requestAnimationFrame(animate);
            if (!gameActive) return;

            let speed = 0.12;
            if (moveVector.length() > 0) {
                let moveDir = new THREE.Vector3(moveVector.x, 0, moveVector.y).normalize();
                moveDir.applyAxisAngle(new THREE.Vector3(0, 1, 0), camYaw);

                let nextX = new THREE.Vector3(playerPos.x + moveDir.x * speed, playerPos.y, playerPos.z);
                let nextZ = new THREE.Vector3(playerPos.x, playerPos.y, playerPos.z + moveDir.z * speed);

                if (!checkCollision(nextX)) playerPos.x = nextX.x;
                if (!checkCollision(nextZ)) playerPos.z = nextZ.z;
            }

            // تحديث مكان الكاميرا والمصباح اليدوي
            camera.position.copy(playerPos);
            let dir = new THREE.Vector3(
                Math.sin(camYaw) * Math.cos(camPitch),
                Math.sin(camPitch),
                Math.cos(camYaw) * Math.cos(camPitch)
            );
            camera.lookAt(playerPos.clone().add(dir));

            flashlight.position.copy(playerPos);
            flashlight.target.position.copy(playerPos.clone().add(dir.clone().multiplyScalar(10)));
            flashlight.target.updateMatrixWorld();

            // فحص التقاط المفاتيح
            for (let i = keys.length - 1; i >= 0; i--) {
                let k = keys[i];
                k.rotation.y += 0.05;
                if (k.position.distanceTo(playerPos) < 1.2) {
                    scene.remove(k);
                    keys.splice(i, 1);
                    keysLeft--;
                    document.getElementById('status-txt').innerText = `المفاتيح المتبقية: ${keysLeft}`;
                    if (keysLeft === 0) {
                        endGame(true);
                    }
                }
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
