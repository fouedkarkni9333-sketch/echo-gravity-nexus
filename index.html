<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo-Gravity: Nexus</title>
    <style>
        body {
            margin: 0;
            background: #090d16;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        h1 {
            color: #10b981;
            font-size: 18px;
            margin: 0 0 5px 0;
            text-align: center;
        }
        p {
            color: #94a3b8;
            font-size: 12px;
            margin: 0 0 10px 0;
        }
        canvas {
            background: #111827;
            border: 3px solid #10b981;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
            max-width: 95vw;
            max-height: 55vh;
        }
        .btn-container {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }
        button {
            background: #10b981;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.5);
        }
        button:active {
            transform: scale(0.95);
        }
        .btn-build {
            background: #2563eb;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.5);
        }
    </style>
</head>
<body>

    <h1>Echo-Gravity: Nexus</h1>
    <p>لعبة المكعبات والجاذبية - تعمل مباشرة من هاتفك</p>

    <canvas id="gameCanvas" width="750" height="350"></canvas>

    <div class="btn-container">
        <button onclick="toggleGravity()">🔄 قلب الجاذبية</button>
        <button class="btn-build" onclick="spawnBox()">📦 بناء مكعب</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let player = {
            x: 80,
            y: 260,
            w: 35,
            h: 45,
            vy: 0,
            gravity: 0.5,
            flipped: false
        };

        let blocks = [
            { x: 300, y: 280, w: 40, h: 40 },
            { x: 500, y: 260, w: 40, h: 60 }
        ];

        let score = 0;

        function toggleGravity() {
            player.flipped = !player.flipped;
            player.gravity = -player.gravity;
        }

        function spawnBox() {
            blocks.push({
                x: player.x + 70,
                y: player.flipped ? 50 : 270,
                w: 40,
                h: 40
            });
            score += 10;
        }

        function update() {
            player.y += player.vy;
            player.vy += player.gravity;

            if (!player.flipped && player.y > 260) {
                player.y = 260;
                player.vy = 0;
            } else if (player.flipped && player.y < 45) {
                player.y = 45;
                player.vy = 0;
            }

            blocks.forEach(b => {
                b.x -= 2;
                if (b.x < -50) {
                    b.x = canvas.width + 50;
                    b.y = Math.random() > 0.5 ? 260 : 50;
                }
            });
        }

        function draw() {
            // مسح الشاشة
            ctx.fillStyle = "#111827";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // الأرضية والسقف
            ctx.fillStyle = "#065f46";
            ctx.fillRect(0, 0, canvas.width, 40);
            ctx.fillRect(0, 310, canvas.width, 40);

            // رسم المكعبات
            blocks.forEach(b => {
                ctx.fillStyle = "#10b981";
                ctx.fillRect(b.x, b.y, b.w, b.h);
                ctx.fillStyle = "#059669";
                ctx.fillRect(b.x, b.y, b.w, 8);
            });

            // رسم البطل
            ctx.fillStyle = "#3b82f6";
            ctx.fillRect(player.x, player.y, player.w, player.h);
            
            // رأس البطل
            ctx.fillStyle = "#fde047";
            ctx.fillRect(player.x + 5, player.flipped ? player.y + 30 : player.y - 10, 25, 12);

            // النقاط
            ctx.fillStyle = "white";
            ctx.font = "bold 15px Arial";
            ctx.fillText("النقاط: " + score, 20, 28);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
