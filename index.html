<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo-Gravity: Nexus | عالم المكعبات المفتوح</title>
    <style>
        body {
            margin: 0;
            background: #1a1c29;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #canvas-container {
            width: 100vw;
            height: 75vh;
            position: absolute;
            top: 0;
            left: 0;
        }
        .ui-overlay {
            position: absolute;
            top: 15px;
            z-index: 10;
            text-align: center;
            background: rgba(15, 23, 42, 0.85);
            padding: 10px 25px;
            border-radius: 12px;
            border: 2px solid #10b981;
            backdrop-filter: blur(6px);
        }
        h1 {
            margin: 0 0 4px 0;
            font-size: 17px;
            color: #34d399;
            text-shadow: 0 0 10px rgba(52, 211, 153, 0.5);
        }
        p {
            margin: 0;
            font-size: 11px;
            color: #94a3b8;
        }
        .controls {
            position: absolute;
            bottom: 20px;
            z-index: 10;
            display: flex;
            gap: 15px;
        }
        .btn-game {
            background: linear-gradient(135deg, #059669, #10b981);
            color: white;
            border: none;
            padding: 15px 28px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 40px;
            box-shadow: 0 0 18px rgba(16, 185, 129, 0.5);
            cursor: pointer;
            outline: none;
            transition: 0.1s;
        }
        .btn-action {
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            box-shadow: 0 0 18px rgba(59, 130, 246, 0.5);
        }
        .btn-game:active {
            transform: scale(0.95);
        }
    </style>
    <!-- تضمين مكتبة Three.js ثلاثية الأبعاد -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div class="ui-overlay">
        <h1>Echo-Gravity: Nexus (Voxel Craft Edition)</h1>
        <p>عالم مكعبات مفتوح، بناء، وقلب الجاذبية الطيفي!</p>
    </div>

    <div id="canvas-container"></div>

    <div class="controls">
        <button class="btn-game" onclick="toggleGravity()">🔄 قلب الجاذبية</button>
        <button class="btn-game btn-action" onclick="spawnEchoBox()">📦 بناء صندوق / نسخ</button>
    </div>

    <script>
        // إعداد مشهد العالم الافتراضي بنمط المكعبات
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);
        scene.fog = new THREE.FogExp2(0x0f172a, 0.02);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 6, 14);
        camera.lookAt(0, 2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // الإضاءة
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0x34d399, 1);
        dirLight.position.set(15, 30, 15);
        scene.add(dirLight);

        // بناء أرضية المكعبات (تشبه ماينكرافت)
        const groundGeo = new THREE.BoxGeometry(40, 1, 40);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x065f46, roughness: 0.9 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.position.y = -0.5;
        scene.add(ground);

        // بناء مكعبات الأشجار والبيئة في العالم المفتوح
        function createVoxelTree(x, z) { جذع الشجرة
            const trunkGeo = new THREE.BoxGeometry(0.8, 3, 0.8);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x78350f });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.set(x, 1.5, z);
            scene.add(trunk);

            // أوراق الشجرة (مكعبات خضراء)
            const leavesGeo = new THREE.BoxGeometry(2.5, 2.5, 2.5);
            const leavesMat = new THREE.MeshStandardMaterial({ color: 0x047857 });
            const leaves = new THREE.Mesh(leavesGeo, leavesMat);
            leaves.position.set(x, 3.5, z);
            scene.add(leaves);
        }

        createVoxelTree(-5, -6);
        createVoxelTree(6, -8);
        createVoxelTree(-8, -3);

        // تصميم شخصية البطل بأسلوب المكعبات والكتل (Voxel Character)
        function createVoxelCharacter(color) {
            const group = new THREE.Group();

            // الجسم
            const bodyGeo = new THREE.BoxGeometry(1, 1.2, 0.6);
            const bodyMat = new THREE.MeshStandardMaterial({ color: color });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.1;
            group.add(body);

            // الرأس
            const headGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xfde047 }); // لون مميز للوجه
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 2.0;
            group.add(head);

            // الأرجل
            const legGeo = new THREE.BoxGeometry(0.35, 0.8, 0.35);
            const legMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });
            
            const leftLeg = new THREE.Mesh(legGeo, legMat);
            leftLeg.position.set(-0.25, 0.4, 0);
            group.add(leftLeg);

            const rightLeg = new THREE.Mesh(legGeo, legMat);
            rightLeg.position.set(0.25, 0.4, 0);
            group.add(rightLeg);

            return group;
        }

        // إضافة البطل للساحة
        const player = createVoxelCharacter(0x2563eb); // لون أزرق للمقاتل
        player.position.set(-3, 0, 2);
        scene.add(player);

        // صندوق أو عنصر تم إنشاؤه في العالم
        const boxes = [];

        let isGravityFlipped = false;

        function toggleGravity() {
            isGravityFlipped = !isGravityFlipped;
        }

        function spawnEchoBox() {
            // إنشاء صندوق طيفي جديد في العالم (مثل نظام البناء والتغطية)
            const boxGeo = new THREE.BoxGeometry(1, 1, 1);
            const boxMat = new THREE.MeshStandardMaterial({ color: 0x10b981, roughness: 0.3 });
            const newBox = new THREE.Mesh(boxGeo, boxMat);
            newBox.position.set(player.position.x + 2, isGravityFlipped ? 3.5 : 0.5, player.position.z);
            scene.add(newBox);
            boxes.push(newBox);
        }

        // حلقة التشغيل والتحريك المستمر
        function animate() {
            requestAnimationFrame(animate);

            // تفاعل الجاذبية والقفز للبطل
            if (isGravityFlipped) {
                player.position.y += (3.5 - player.position.y) * 0.15;
                player.rotation.z = Math.PI;
            } else {
                player.position.y += (0 - player.position.y) * 0.15;
                player.rotation.z = 0;
            }

            // حركة خفيفة للحفاظ على حيوية المشهد
            player.position.x += Math.sin(Date.now() * 0.003) * 0.01;

            renderer.render(scene, camera);
        }

        animate();

        // التكيف مع شاشات الهواتف عند تغيير الوضع
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
